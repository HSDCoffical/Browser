plugins {
    id 'com.android.application'
}

android {
    compileSdk 33

    signingConfigs {
        debug {
            storeFile file("mybrowser.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "PKCS12"
        }
    }

    defaultConfig {
        applicationId "com.yourname.mybrowser"
        minSdk 21
        targetSdk 33
        versionCode ((int) (System.currentTimeMillis() / 1000))
        versionName "1.0." + ((int) (System.currentTimeMillis() / 1000))
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}