plugins {
    id 'com.android.application'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.yourname.mybrowser"
        minSdk 21
        targetSdk 33
        versionCode ((int) (System.currentTimeMillis() / 1000))
        versionName "1.0." + ((int) (System.currentTimeMillis() / 1000))
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}