<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工具箱 - MyBrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f2f4f8;
            padding: 16px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            color: #1a1a2e;
        }
        .header .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #2979ff;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .header .back-btn:active {
            background: rgba(41, 121, 255, 0.1);
        }
        .tool-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tool-item {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tool-item:active {
            background: #f5f7fa;
            transform: scale(0.98);
        }
        .tool-item .tool-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .tool-item .tool-name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a2e;
        }
        .tool-item .tool-desc {
            font-size: 13px;
            color: #888;
        }
        .tool-item .tool-arrow {
            color: #ccc;
            font-size: 20px;
        }
        /* 浮层样式 */
        .tool-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .tool-overlay .sheet {
            background: #fff;
            border-radius: 16px;
            max-width: 92%;
            max-height: 90%;
            width: 540px;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .tool-overlay .sheet .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 12px;
            right: 16px;
            color: #999;
        }
        .tool-overlay .sheet .close-btn:active {
            color: #555;
        }
        .tool-overlay .sheet h3 {
            margin: 0 0 16px 0;
            font-size: 18px;
            color: #1a1a2e;
        }
        .tool-overlay .sheet .field-group {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tool-overlay .sheet input, .tool-overlay .sheet select, .tool-overlay .sheet textarea {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            background: #f9f9f9;
            outline: none;
        }
        .tool-overlay .sheet input:focus, .tool-overlay .sheet select:focus, .tool-overlay .sheet textarea:focus {
            border-color: #2979ff;
            background: #fff;
        }
        .tool-overlay .sheet textarea {
            width: 100%;
            font-family: monospace;
            resize: vertical;
        }
        .tool-overlay .sheet .btn-primary {
            padding: 8px 20px;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .tool-overlay .sheet .btn-primary:active {
            background: #1a5fd0;
        }
        .tool-overlay .sheet .btn-secondary {
            padding: 8px 20px;
            background: #f5a623;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .tool-overlay .sheet .btn-danger {
            padding: 8px 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .tool-overlay .sheet .result-box {
            background: #f5f5f5;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #eee;
            margin-top: 8px;
        }
        .tool-overlay .sheet .header-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .tool-overlay .sheet .header-row span:first-child {
            font-weight: 500;
        }
        .tool-overlay .sheet .header-row span:last-child {
            color: #888;
        }
        .tool-overlay .sheet .flex-row {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            align-items: center;
        }
        .tool-overlay .sheet .flex-row input {
            flex: 1;
        }
        .tool-overlay .sheet .flex-row button {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .tool-overlay .sheet .flex-row .remove-header {
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .tool-overlay .sheet .headers-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 120px;
            overflow-y: auto;
            padding: 4px 0;
        }
        .tool-overlay .sheet .headers-container .header-item {
            display: flex;
            gap: 4px;
        }
        .tool-overlay .sheet .headers-container .header-item input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧰 工具箱</h1>
        <button class="back-btn" id="backBtn">← 返回</button>
    </div>
    <div class="tool-grid" id="toolGrid">
        <!-- 工具列表由 JS 动态生成 -->
    </div>

    <script>
        // ============================================================
        // 工具列表配置
        // ============================================================
        var tools = [
            { id: 'http', label: '🌐 HTTP 请求测试', desc: '支持 GET/POST/PUT/DELETE，自定义请求头与请求体' },
            { id: 'whois', label: '📋 WHOIS 查询', desc: '查询域名的 WHOIS 信息' },
            { id: 'ping', label: '📡 Ping 检测', desc: '通过 HTTP 检测服务器延迟' },
            { id: 'dns', label: '🔍 DNS 查询', desc: '查询域名 A/AAAA/CNAME/MX/TXT/NS 记录' },
            { id: 'ip', label: '🌍 IP 信息查询', desc: '查询本机或指定 IP 的地理位置和 ISP' },
            { id: 'b64', label: '🔐 Base64 编解码', desc: '文本与 Base64 互转' },
            { id: 'url', label: '🔗 URL 编解码', desc: 'URL 编码与解码' }
        ];

        // ============================================================
        // 渲染工具列表
        // ============================================================
        function renderTools() {
            var grid = document.getElementById('toolGrid');
            if (!grid) {
                alert('错误：未找到工具列表容器');
                return;
            }
            grid.innerHTML = '';
            tools.forEach(function(tool) {
                var div = document.createElement('div');
                div.className = 'tool-item';
                div.dataset.id = tool.id;
                div.innerHTML = '<div class="tool-info"><span class="tool-name">' + tool.label + '</span><span class="tool-desc">' + tool.desc + '</span></div><span class="tool-arrow">›</span>';
                grid.appendChild(div);
                div.addEventListener('click', function() {
                    openTool(tool.id);
                });
            });
            // 调试信息：显示已渲染的工具数量
            console.log('工具箱已渲染，工具数量：' + tools.length);
        }

        // ============================================================
        // 通用浮层创建
        // ============================================================
        function createOverlay(title, contentHTML) {
            var overlay = document.createElement('div');
            overlay.className = 'tool-overlay';
            overlay.innerHTML = `
                <div class="sheet">
                    <button class="close-btn">✕</button>
                    <h3>${title}</h3>
                    ${contentHTML}
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('.close-btn').addEventListener('click', function() {
                overlay.remove();
            });
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.remove();
            });
            return overlay;
        }

        // ============================================================
        // 工具实现（与之前相同，但为了完整，全部包含）
        // ============================================================
        function openTool(id) {
            switch (id) {
                case 'http': openHttpTool(); break;
                case 'whois': openWhoisTool(); break;
                case 'ping': openPingTool(); break;
                case 'dns': openDnsTool(); break;
                case 'ip': openIpTool(); break;
                case 'b64': openBase64Tool(); break;
                case 'url': openUrlTool(); break;
                default: alert('工具未实现');
            }
        }

        // ---------- HTTP ----------
        function openHttpTool() {
            var html = `
                <div class="field-group">
                    <select id="nt-method" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd;background:#f9f9f9;font-size:14px;">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                        <option value="HEAD">HEAD</option>
                        <option value="OPTIONS">OPTIONS</option>
                    </select>
                    <input id="nt-url" type="text" placeholder="请求URL" style="flex:3;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;">
                    <button id="nt-send" class="btn-primary">发送</button>
                </div>
                <div style="margin-bottom:8px;">
                    <div class="flex-row">
                        <span style="font-weight:500;font-size:14px;">请求头</span>
                        <button id="nt-add-header" style="background:none;border:1px solid #ddd;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;">+</button>
                    </div>
                    <div class="headers-container" id="nt-headers-container">
                        <div class="header-item">
                            <input class="nt-header-key" placeholder="Key" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
                            <input class="nt-header-value" placeholder="Value" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
                            <button class="remove-header" style="background:none;border:none;color:#e74c3c;cursor:pointer;">✕</button>
                        </div>
                    </div>
                </div>
                <div style="margin-bottom:8px;">
                    <textarea id="nt-body" rows="4" placeholder="请求体（JSON/文本）" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:monospace;resize:vertical;"></textarea>
                </div>
                <div style="margin-bottom:8px;">
                    <div class="header-row">
                        <span id="nt-status">状态码：</span>
                        <span id="nt-time" style="color:#888;">耗时：</span>
                    </div>
                    <div style="margin-top:4px;">
                        <div style="font-weight:500;font-size:14px;">响应头</div>
                        <div id="nt-response-headers" class="result-box" style="max-height:80px;"></div>
                    </div>
                    <div style="margin-top:8px;">
                        <div style="font-weight:500;font-size:14px;">响应体</div>
                        <div id="nt-response-body" class="result-box" style="max-height:200px;"></div>
                    </div>
                </div>
            `;
            var overlay = createOverlay('🌐 HTTP 请求测试', html);

            overlay.querySelector('#nt-add-header').addEventListener('click', function() {
                var container = overlay.querySelector('#nt-headers-container');
                var div = document.createElement('div');
                div.className = 'header-item';
                div.innerHTML = `
                    <input class="nt-header-key" placeholder="Key" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
                    <input class="nt-header-value" placeholder="Value" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
                    <button class="remove-header" style="background:none;border:none;color:#e74c3c;cursor:pointer;">✕</button>
                `;
                container.appendChild(div);
                div.querySelector('.remove-header').addEventListener('click', function() {
                    if (container.children.length > 1) div.remove();
                    else alert('至少保留一个请求头');
                });
            });
            overlay.querySelectorAll('.remove-header').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var parent = this.parentElement;
                    if (parent.parentElement.children.length > 1) {
                        parent.remove();
                    } else {
                        alert('至少保留一个请求头');
                    }
                });
            });

            overlay.querySelector('#nt-send').addEventListener('click', function() {
                var method = overlay.querySelector('#nt-method').value;
                var url = overlay.querySelector('#nt-url').value.trim();
                if (!url) {
                    alert('请输入请求URL');
                    return;
                }

                var headers = {};
                var headerKeys = overlay.querySelectorAll('.nt-header-key');
                var headerValues = overlay.querySelectorAll('.nt-header-value');
                for (var i = 0; i < headerKeys.length; i++) {
                    var key = headerKeys[i].value.trim();
                    var val = headerValues[i].value.trim();
                    if (key && val) headers[key] = val;
                }

                var body = overlay.querySelector('#nt-body').value;
                var statusEl = overlay.querySelector('#nt-status');
                var timeEl = overlay.querySelector('#nt-time');
                var respBody = overlay.querySelector('#nt-response-body');
                var respHeaders = overlay.querySelector('#nt-response-headers');

                statusEl.textContent = '状态码：发送中...';
                timeEl.textContent = '耗时：';
                respBody.textContent = '等待响应...';
                respHeaders.textContent = '';

                var startTime = Date.now();
                var fetchOptions = {
                    method: method,
                    headers: headers,
                    body: (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') ? body : undefined
                };

                fetch(url, fetchOptions)
                    .then(function(response) {
                        var elapsed = Date.now() - startTime;
                        statusEl.textContent = '状态码：' + response.status + ' ' + response.statusText;
                        timeEl.textContent = '耗时：' + elapsed + 'ms';
                        var headerText = '';
                        response.headers.forEach(function(value, key) {
                            headerText += key + ': ' + value + '\n';
                        });
                        respHeaders.textContent = headerText;
                        return response.text();
                    })
                    .then(function(data) {
                        try {
                            var json = JSON.parse(data);
                            respBody.textContent = JSON.stringify(json, null, 2);
                        } catch(e) {
                            respBody.textContent = data;
                        }
                    })
                    .catch(function(err) {
                        statusEl.textContent = '状态码：请求失败';
                        timeEl.textContent = '耗时：-';
                        respBody.textContent = '错误：' + err.message;
                    });
            });
        }

        // ---------- WHOIS ----------
        function openWhoisTool() {
            var html = `
                <div class="field-group">
                    <input id="whois-domain" type="text" placeholder="输入域名（如 example.com）" style="flex:3;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;">
                    <button id="whois-query" class="btn-primary">查询</button>
                </div>
                <div id="whois-result" class="result-box"></div>
            `;
            var overlay = createOverlay('📋 WHOIS 查询', html);
            overlay.querySelector('#whois-query').addEventListener('click', function() {
                var domain = overlay.querySelector('#whois-domain').value.trim();
                if (!domain) { alert('请输入域名'); return; }
                var resultDiv = overlay.querySelector('#whois-result');
                resultDiv.textContent = '查询中...';
                fetch('https://api.hackertarget.com/whois/?q=' + encodeURIComponent(domain))
                    .then(function(res) { return res.text(); })
                    .then(function(data) {
                        resultDiv.textContent = data || '未获取到信息';
                    })
                    .catch(function(err) {
                        resultDiv.textContent = '查询失败：' + err.message;
                    });
            });
        }

        // ---------- Ping ----------
        function openPingTool() {
            var html = `
                <div class="field-group">
                    <input id="ping-host" type="text" placeholder="输入域名或IP（如 google.com）" style="flex:3;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;">
                    <button id="ping-start" class="btn-primary">Ping</button>
                </div>
                <div id="ping-result" class="result-box"></div>
            `;
            var overlay = createOverlay('📡 Ping 检测', html);
            overlay.querySelector('#ping-start').addEventListener('click', function() {
                var host = overlay.querySelector('#ping-host').value.trim();
                if (!host) { alert('请输入域名或IP'); return; }
                var resultDiv = overlay.querySelector('#ping-result');
                resultDiv.textContent = '正在检测...\n';
                var url = host;
                if (!host.startsWith('http://') && !host.startsWith('https://')) {
                    url = 'https://' + host;
                }
                var startTime = Date.now();
                fetch(url, { method: 'HEAD', mode: 'no-cors' })
                    .then(function() {
                        var elapsed = Date.now() - startTime;
                        resultDiv.textContent = '✅ 响应正常，延迟：' + elapsed + 'ms';
                    })
                    .catch(function(err) {
                        fetch(url, { method: 'GET', mode: 'no-cors' })
                            .then(function() {
                                var elapsed = Date.now() - startTime;
                                resultDiv.textContent = '✅ 响应正常（no-cors），延迟：' + elapsed + 'ms';
                            })
                            .catch(function(e) {
                                resultDiv.textContent = '❌ 请求失败：' + e.message + '\n注意：某些网站可能禁止跨域请求，可尝试使用 HTTP 测试工具。';
                            });
                    });
            });
        }

        // ---------- DNS ----------
        function openDnsTool() {
            var html = `
                <div class="field-group">
                    <input id="dns-domain" type="text" placeholder="输入域名" style="flex:2;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;">
                    <select id="dns-type" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd;background:#f9f9f9;font-size:14px;">
                        <option value="A">A</option>
                        <option value="AAAA">AAAA</option>
                        <option value="CNAME">CNAME</option>
                        <option value="MX">MX</option>
                        <option value="TXT">TXT</option>
                        <option value="NS">NS</option>
                    </select>
                    <button id="dns-query" class="btn-primary">查询</button>
                </div>
                <div id="dns-result" class="result-box"></div>
            `;
            var overlay = createOverlay('🔍 DNS 查询', html);
            overlay.querySelector('#dns-query').addEventListener('click', function() {
                var domain = overlay.querySelector('#dns-domain').value.trim();
                var type = overlay.querySelector('#dns-type').value;
                if (!domain) { alert('请输入域名'); return; }
                var resultDiv = overlay.querySelector('#dns-result');
                resultDiv.textContent = '查询中...';
                var url = 'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(domain) + '&type=' + type;
                fetch(url, { headers: { 'Accept': 'application/dns-json' } })
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (data.Status === 0 && data.Answer) {
                            var lines = [];
                            data.Answer.forEach(function(ans) {
                                lines.push(ans.name + '  ' + ans.type + '  ' + ans.data);
                            });
                            resultDiv.textContent = lines.join('\n') || '无记录';
                        } else {
                            resultDiv.textContent = '未找到记录或查询失败';
                        }
                    })
                    .catch(function(err) {
                        resultDiv.textContent = '查询失败：' + err.message;
                    });
            });
        }

        // ---------- IP ----------
        function openIpTool() {
            var html = `
                <div class="field-group">
                    <input id="ip-address" type="text" placeholder="输入IP地址（留空查本机）" style="flex:3;padding:8px;border-radius:6px;border:1px solid #ddd;font-size:14px;">
                    <button id="ip-query" class="btn-primary">查询</button>
                </div>
                <div id="ip-result" class="result-box"></div>
            `;
            var overlay = createOverlay('🌍 IP 信息查询', html);
            overlay.querySelector('#ip-query').addEventListener('click', function() {
                var ip = overlay.querySelector('#ip-address').value.trim();
                var resultDiv = overlay.querySelector('#ip-result');
                resultDiv.textContent = '查询中...';
                var url = ip ? 'https://ip-api.com/json/' + ip : 'https://ip-api.com/json/';
                fetch(url)
                    .then(function(res) { return res.json(); })
                    .then(function(data) {
                        if (data.status === 'success') {
                            resultDiv.textContent = 'IP: ' + data.query + '\n' +
                                '国家: ' + data.country + '\n' +
                                '地区: ' + data.regionName + '\n' +
                                '城市: ' + data.city + '\n' +
                                'ISP: ' + data.isp + '\n' +
                                '时区: ' + data.timezone + '\n' +
                                '经纬度: ' + data.lat + ', ' + data.lon;
                        } else {
                            resultDiv.textContent = '查询失败：' + (data.message || '未知错误');
                        }
                    })
                    .catch(function(err) {
                        resultDiv.textContent = '查询失败：' + err.message;
                    });
            });
        }

        // ---------- Base64 ----------
        function openBase64Tool() {
            var html = `
                <div style="margin-bottom:8px;">
                    <textarea id="b64-input" rows="4" placeholder="输入要编码/解码的文本" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:monospace;resize:vertical;"></textarea>
                </div>
                <div style="display:flex;gap:8px;margin-bottom:8px;">
                    <button id="b64-encode" class="btn-primary">编码</button>
                    <button id="b64-decode" class="btn-secondary">解码</button>
                    <button id="b64-clear" class="btn-danger">清空</button>
                </div>
                <div>
                    <div style="font-weight:500;font-size:14px;">结果</div>
                    <div id="b64-result" class="result-box" style="min-height:60px;"></div>
                </div>
            `;
            var overlay = createOverlay('🔐 Base64 编解码', html);
            overlay.querySelector('#b64-encode').addEventListener('click', function() {
                var input = overlay.querySelector('#b64-input').value;
                try {
                    var encoded = btoa(unescape(encodeURIComponent(input)));
