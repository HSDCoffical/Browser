<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyBrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #e8ecf1;
            overflow: hidden;
            user-select: none;
        }
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.2s ease-in-out;
        }

        /* 夜间模式 */
        body.night-mode {
            background-color: #1a1a2e;
            color: #eee;
        }
        body.night-mode .search-box {
            background: rgba(40, 40, 60, 0.85);
            border-color: rgba(255,255,255,0.1);
        }
        body.night-mode .search-box input {
            color: #eee;
        }
        body.night-mode .search-box input::placeholder {
            color: #aaa;
        }
        body.night-mode .bottom-actions .nav-capsule {
            background: rgba(40, 40, 60, 0.85);
            border-color: rgba(255,255,255,0.1);
        }
        body.night-mode .panel-sheet {
            background: rgba(30, 30, 50, 0.92);
            color: #eee;
        }
        body.night-mode .menu-list .menu-item {
            border-bottom-color: rgba(255,255,255,0.05);
        }
        body.night-mode .menu-list .menu-item .mi-label {
            color: #eee;
        }
        body.night-mode .menu-list .menu-item .mi-arrow {
            color: #888;
        }
        body.night-mode .settings-option {
            border-bottom-color: rgba(255,255,255,0.05);
        }
        body.night-mode .settings-option .s-label {
            color: #eee;
        }
        body.night-mode .panel-header .panel-title {
            color: #eee;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.10);
        }

        .status-bar {
            height: 32px;
            flex-shrink: 0;
            background: transparent;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 18px 12px 18px;
            overflow-y: auto;
        }

        .search-section {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 0 4px 0 0;
            transition: box-shadow 0.3s ease, background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .search-box:focus-within {
            box-shadow: 0 4px 20px rgba(41, 121, 255, 0.25);
            background: rgba(255, 255, 255, 0.95);
        }

        .engine-btn {
            flex-shrink: 0;
            padding: 0 10px 0 16px;
            height: 48px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: #2979ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            position: relative;
            z-index: 5;
        }
        .engine-btn::after {
            content: "▾";
            font-size: 11px;
            color: #999;
            margin-left: 2px;
        }
        .engine-btn:active {
            opacity: 0.6;
        }

        .engine-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 8px 0;
            transform-origin: top center;
            transform: scaleY(0) translateY(-10px);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
            z-index: 20;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            max-height: 300px;
            overflow-y: auto;
        }
        .engine-dropdown.open {
            transform: scaleY(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .engine-dropdown .ed-item {
            padding: 12px 18px;
            font-size: 14px;
            color: #1a1a2e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .engine-dropdown .ed-item:last-child {
            border-bottom: none;
        }
        .engine-dropdown .ed-item:active {
            background: rgba(41, 121, 255, 0.10);
        }
        .engine-dropdown .ed-item .ed-check {
            color: #2979ff;
            font-weight: 600;
        }
        .engine-dropdown .ed-custom {
            padding: 10px 18px;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .engine-dropdown .ed-custom input {
            flex: 1;
            min-width: 80px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            background: rgba(255,255,255,0.7);
        }
        .engine-dropdown .ed-custom input:focus {
            border-color: #2979ff;
        }
        .engine-dropdown .ed-custom button {
            padding: 8px 16px;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .engine-dropdown .ed-custom button:active {
            background: #1a5fd0;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px 4px;
            background: transparent;
            color: #1a1a2e;
            min-width: 0;
            height: 48px;
        }
        .search-box input::placeholder {
            color: #888;
            font-size: 15px;
            font-weight: 400;
        }

        .search-btn {
            flex-shrink: 0;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-right: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(41, 121, 255, 0.3);
        }
        .search-btn:active {
            background: #1a5fd0;
            transform: scale(0.96);
        }

        /* 底部胶囊 */
        .bottom-actions {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding: 12px 20px 24px 20px;
            background: transparent;
            position: relative;
            z-index: 200;
        }
        .bottom-actions .nav-capsule {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 2px 6px;
            min-width: 120px;
            height: 40px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .bottom-actions .nav-capsule .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 4px 12px;
            border-radius: 24px;
            min-width: 44px;
            background: transparent;
            border: none;
            font-size: 20px;
            color: #1a1a2e;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            line-height: 1;
        }
        .bottom-actions .nav-capsule .action-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.4);
        }
        .bottom-actions .nav-capsule .divider {
            width: 1px;
            height: 22px;
            background: rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        /* 面板系统 - 使用 transform+opacity 控制 */
        .panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 100;
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .panel-overlay.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .panel-sheet {
            position: fixed;
            bottom: 76px;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 28px 28px 0 0;
            z-index: 101;
            display: flex;
            flex-direction: column;
            max-height: calc(100% - 76px);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.10);
            border-top: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s ease;
        }
        .panel-sheet.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 12px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }
        .panel-header .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .panel-header .panel-close {
            font-size: 26px;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .panel-header .panel-close:active {
            color: #555;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px 28px 18px;
            -webkit-overflow-scrolling: touch;
        }
        .panel-body::-webkit-scrollbar {
            display: none;
        }

        /* 菜单列表 */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-top: 4px;
        }
        .menu-list .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 4px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: background 0.1s;
            border-radius: 4px;
        }
        .menu-list .menu-item:active {
            background: rgba(0, 0, 0, 0.03);
        }
        .menu-list .menu-item .mi-label {
            font-size: 15px;
            color: #1a1a2e;
        }
        .menu-list .menu-item .mi-arrow {
            color: #ccc;
            font-size: 18px;
        }

        /* 窗口列表 */
        .window-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 4px;
        }
        .window-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .window-item:active {
            background: rgba(255, 255, 255, 0.8);
        }
        .window-item .w-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(41, 121, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #2979ff;
            flex-shrink: 0;
        }
        .window-item .w-info {
            flex: 1;
            overflow: hidden;
        }
        .window-item .w-info .w-title {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .window-item .w-info .w-url {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .window-item .w-del {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            flex-shrink: 0;
            transition: color 0.15s;
        }
        .window-item .w-del:active {
            color: #e74c3c;
        }
        .window-empty {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 40px 0;
        }
        .window-add {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }
        .window-add button {
            background: rgba(41, 121, 255, 0.9);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        .window-add button:active {
            background: #1a5fd0;
            transform: scale(0.97);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            padding: 16px 30px;
            border-radius: 14px;
            font-size: 15px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            text-align: center;
            max-width: 75%;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .hidden {
            display: none !important;
        }

        /* 设置选项 */
        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 4px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            cursor: pointer;
        }
        .settings-option:active {
            background: rgba(0,0,0,0.03);
        }
        .settings-option .s-label {
            font-size: 15px;
            color: #1a1a2e;
        }
        .settings-option .s-value {
            font-size: 14px;
            color: #2979ff;
        }
        .settings-option input[type="file"] {
            display: none;
        }

        /* 功能面板通用列表 */
        .func-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 4px;
        }
        .func-list .func-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 6px;
            background: rgba(255,255,255,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .func-list .func-item .func-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            flex: 1;
        }
        .func-list .func-item .func-title {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .func-list .func-item .func-desc {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .func-list .func-item .func-action {
            padding: 6px 14px;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        .func-list .func-item .func-action:active {
            background: #1a5fd0;
        }
        .func-list .func-item .func-del {
            color: #e74c3c;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
        }
        .func-add {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .func-add input {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            background: rgba(255,255,255,0.7);
        }
        .func-add input:focus {
            border-color: #2979ff;
        }
        .func-add button {
            padding: 10px 20px;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .func-add button:active {
            background: #1a5fd0;
        }

        /* 轮播设置 */
        .carousel-setting {
            margin-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 12px;
        }
        .carousel-setting .cs-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }
        .carousel-setting .cs-row label {
            font-size: 14px;
            color: #1a1a2e;
        }
        .carousel-setting .cs-row input[type="number"] {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }
        .carousel-setting .cs-row input[type="number"]:focus {
            border-color: #2979ff;
        }
        .carousel-setting .cs-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .carousel-setting .cs-preview .cs-thumb-wrap {
            position: relative;
            display: inline-block;
        }
        .carousel-setting .cs-preview .cs-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border 0.2s;
            cursor: pointer;
        }
        .carousel-setting .cs-preview .cs-thumb.active {
            border-color: #2979ff;
        }
        .carousel-setting .cs-preview .cs-thumb-wrap .cs-del {
            position: absolute;
            top: -6px;
            right: -6px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }
        .carousel-setting .cs-preview .cs-thumb-wrap .cs-del:active {
            background: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"></div>

        <div class="content-area">
            <div class="search-section">
                <div class="search-box">
                    <button class="engine-btn" id="engineBtn">必应 ▾</button>
                    <input type="text" id="searchInput" placeholder="搜索或输入网址" autofocus>
                    <button class="search-btn" id="searchBtn">搜索</button>
                </div>
                <div class="engine-dropdown" id="engineDropdown"></div>
            </div>
        </div>

        <!-- 底部胶囊 -->
        <div class="bottom-actions">
            <div class="nav-capsule">
                <button class="action-btn" id="navMenu">☰</button>
                <div class="divider"></div>
                <button class="action-btn" id="navWindow">⊞</button>
            </div>
        </div>
    </div>

    <!-- ===== 第一批结束，第二批紧接下面 ===== -->
    <!-- ===== 菜单面板 ===== -->
    <div class="panel-overlay" id="menuOverlay"></div>
    <div class="panel-sheet" id="menuSheet">
        <div class="panel-header">
            <span class="panel-title">菜单</span>
            <button class="panel-close" data-close="menu">✕</button>
        </div>
        <div class="panel-body">
            <div class="menu-list">
                <div class="menu-item" data-action="settings"><span class="mi-label">设置</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="download"><span class="mi-label">下载管理</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="history"><span class="mi-label">收藏/历史</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="tools"><span class="mi-label">工具箱</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="fav"><span class="mi-label">收藏网址</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="night"><span class="mi-label">夜间模式</span><span class="mi-arrow">›</span></div>
                <div class="menu-item" data-action="exit"><span class="mi-label">退出</span><span class="mi-arrow">›</span></div>
            </div>
        </div>
    </div>

    <!-- ===== 窗口面板 ===== -->
    <div class="panel-overlay" id="windowOverlay"></div>
    <div class="panel-sheet" id="windowSheet">
        <div class="panel-header">
            <span class="panel-title">窗口管理</span>
            <button class="panel-close" data-close="window">✕</button>
        </div>
        <div class="panel-body">
            <div class="window-list" id="windowList"></div>
            <div class="window-add">
                <button id="addWindowBtn">+ 新建窗口</button>
            </div>
        </div>
    </div>

    <!-- ===== 设置面板 ===== -->
    <div class="panel-overlay" id="settingsOverlay"></div>
    <div class="panel-sheet" id="settingsSheet">
        <div class="panel-header">
            <span class="panel-title">设置</span>
            <button class="panel-close" data-close="settings">✕</button>
        </div>
        <div class="panel-body">
            <div class="settings-option" id="bgPickerTrigger">
                <span class="s-label">选择背景图片（多选）</span>
                <span class="s-value">点击选择 ›</span>
                <input type="file" id="bgFileInput" accept="image/*" multiple>
            </div>
            <div class="settings-option" id="resetBg">
                <span class="s-label">恢复默认背景</span>
                <span class="s-value">点击重置 ›</span>

                <div class="func-item"><span class="func-title">📄 页面翻译</span><button class="func-action" onclick="window.showToast('翻译功能开发中')">打开</button></div>

    <!-- ========================================================== -->
    <!-- JavaScript 部分（完整修复）                                 -->
    <!-- ========================================================== -->
    <script>
        // ============================================================
        // 全局 Toast（供内联 onclick 调用）
        // ============================================================
        window.showToast = function(msg) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 1800);
        };

        // ============================================================
        // 数据层
        // ============================================================

        const DEFAULT_ENGINES = [
            { name: '必应', url: 'https://cn.bing.com/search?q={q}&from=vivosearch2025' },
            { name: '百度', url: 'https://www.baidu.com/s?wd={q}' },
            { name: '谷歌', url: 'https://www.google.com/search?q={q}' },
        ];

        let currentEngine = { name: '必应', url: 'https://cn.bing.com/search?q={q}&from=vivosearch2025' };
        let customEngines = [];
        let windows = [];
        let lastVisit = null;
        let isIncognito = false;
        let bgImages = [];
        let currentBgIndex = 0;
        let carouselTimer = null;
        let carouselInterval = 3;

        let downloads = [];
        let favorites = [];
        let history = [];

        // ============================================================
        // 存储
        // ============================================================

        function loadData() {
            try {
                const ce = localStorage.getItem('mybrowser_custom_engines');
                if (ce) customEngines = JSON.parse(ce);
                const eng = localStorage.getItem('mybrowser_current_engine');
                if (eng) currentEngine = JSON.parse(eng);
                const ws = localStorage.getItem('mybrowser_windows');
                if (ws) windows = JSON.parse(ws);
                const lv = localStorage.getItem('mybrowser_last_visit');
                if (lv) lastVisit = JSON.parse(lv);
                const incog = localStorage.getItem('mybrowser_incognito');
                if (incog) isIncognito = JSON.parse(incog);
                const bg = localStorage.getItem('mybrowser_bg_images');
                if (bg) bgImages = JSON.parse(bg);
                const idx = localStorage.getItem('mybrowser_bg_index');
                if (idx) currentBgIndex = parseInt(idx) || 0;
                const interval = localStorage.getItem('mybrowser_carousel_interval');
                if (interval) carouselInterval = parseInt(interval) || 3;

                const dl = localStorage.getItem('mybrowser_downloads');
                if (dl) downloads = JSON.parse(dl);
                const fav = localStorage.getItem('mybrowser_favorites');
                if (fav) favorites = JSON.parse(fav);
                const hist = localStorage.getItem('mybrowser_history');
                if (hist) history = JSON.parse(hist);

                if (bgImages && bgImages.length > 0) {
                    applyBgImage(currentBgIndex);
                }
            } catch (e) { /* ignore */ }
        }

        function saveBgImages() {
            localStorage.setItem('mybrowser_bg_images', JSON.stringify(bgImages));
        }
        function saveBgIndex() {
            localStorage.setItem('mybrowser_bg_index', String(currentBgIndex));
        }
        function saveCarouselInterval() {
            localStorage.setItem('mybrowser_carousel_interval', String(carouselInterval));
        }
        function saveDownloads() {
            localStorage.setItem('mybrowser_downloads', JSON.stringify(downloads));
        }
        function saveFavorites() {
            localStorage.setItem('mybrowser_favorites', JSON.stringify(favorites));
        }
        function saveHistory() {
            localStorage.setItem('mybrowser_history', JSON.stringify(history));
        }
        // 暴露给 Java 调用
        window.addHistory = function(title, url) {
            if (isIncognito) return;
            history = history.filter(item => item.url !== url);
            history.unshift({ title: title || url, url: url, time: Date.now() });
            if (history.length > 100) history = history.slice(0, 100);
            saveHistory();
        };
        window.addDownloadItem = function(name, url) {
            downloads.push({ name, url, time: Date.now() });
            saveDownloads();
            if (document.getElementById('downloadSheet').classList.contains('show')) {
                renderDownloads();
            }
        };

        // ============================================================
        // 背景轮播管理
        // ============================================================

        function applyBgImage(index) {
            if (!bgImages || bgImages.length === 0) {
                document.body.style.backgroundImage = '';
                return;
            }
            const img = bgImages[index % bgImages.length];
            document.body.style.backgroundImage = 'url(' + img + ')';
            currentBgIndex = index;
            saveBgIndex();
            updateCarouselPreview();
        }

        function startCarousel() {
            stopCarousel();
            if (!bgImages || bgImages.length < 2) return;
            const interval = parseInt(document.getElementById('carouselInterval').value) || 3;
            carouselInterval = interval;
            saveCarouselInterval();
            carouselTimer = setInterval(() => {
                const next = (currentBgIndex + 1) % bgImages.length;
                applyBgImage(next);
            }, carouselInterval * 1000);
        }

        function stopCarousel() {
            if (carouselTimer) {
                clearInterval(carouselTimer);
                carouselTimer = null;
            }
        }

        function updateCarouselPreview() {
            const container = document.getElementById('carouselPreview');
            if (!container) return;
            let html = '';
            bgImages.forEach((img, i) => {
                const active = (i === currentBgIndex) ? 'active' : '';
                html += `
                    <div class="cs-thumb-wrap">
                        <img src="${img}" class="cs-thumb ${active}" data-index="${i}">
                        <button class="cs-del" data-index="${i}">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.cs-thumb').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    applyBgImage(idx);
                    startCarousel();
                });
            });
            container.querySelectorAll('.cs-del').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    bgImages.splice(idx, 1);
                    saveBgImages();
                    if (bgImages.length === 0) {
                        document.body.style.backgroundImage = '';
                        stopCarousel();
                    } else {
                        if (currentBgIndex >= bgImages.length) currentBgIndex = 0;
                        applyBgImage(currentBgIndex);
                        startCarousel();
                    }
                    updateCarouselPreview();
                    window.showToast('已删除');
                });
            });
        }

        // ============================================================
        // 收藏 / 历史管理
        // ============================================================

        function addFavorite(title, url) {
            if (favorites.some(item => item.url === url)) {
                window.showToast('已收藏');
                return;
            }
            favorites.unshift({ title: title || url, url: url, time: Date.now() });
            saveFavorites();
            window.showToast('已收藏');
        }

        function renderHistory(mode) {
            const list = document.getElementById('historyList');
            let data = mode === 'fav' ? favorites : history;
            if (data.length === 0) {
                list.innerHTML = '<div class="func-item">暂无记录</div>';
                return;
            }
            let html = '';
            data.forEach((item, idx) => {
                html += `
                    <div class="func-item">
                        <div class="func-info">
                            <div class="func-title">${item.title}</div>
                            <div class="func-desc">${item.url}</div>
                        </div>
                        <div style="display:flex;gap:4px;">
                            <button class="func-action" data-url="${item.url}">打开</button>
                            <button class="func-del" data-idx="${idx}" data-mode="${mode}">✕</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;

            list.querySelectorAll('.func-action').forEach(btn => {
                btn.addEventListener('click', function() {
                    const url = this.dataset.url;
                    if (url) window.location.href = url;
                });
            });
            list.querySelectorAll('.func-del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const mode = this.dataset.mode;
                    if (mode === 'fav') {
                        favorites.splice(idx, 1);
                        saveFavorites();
                    } else {
                        history.splice(idx, 1);
                        saveHistory();
                    }
                    renderHistory(mode);
                    window.showToast('已删除');
                });
            });
        }

        // ============================================================
        // 下载管理
        // ============================================================

        function renderDownloads() {
            const list = document.getElementById('downloadList');
            if (downloads.length === 0) {
                list.innerHTML = '<div class="func-item">暂无下载记录</div>';
                return;
            }
            let html = '';
            downloads.forEach((item, idx) => {
                html += `
                    <div class="func-item">
                        <div class="func-info">
                            <div class="func-title">${item.name}</div>
                            <div class="func-desc">${item.url}</div>
                        </div>
                        <div style="display:flex;gap:4px;">
                            <button class="func-action" data-url="${item.url}">下载</button>
                            <button class="func-del" data-idx="${idx}">✕</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;

            list.querySelectorAll('.func-action').forEach(btn => {
                btn.addEventListener('click', function() {
                    const url = this.dataset.url;
                    if (url) {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.download = '';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }
                });
            });
            list.querySelectorAll('.func-del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    downloads.splice(idx, 1);
                    saveDownloads();
                    renderDownloads();
                    window.showToast('已删除');
                });
            });
        }

        // ============================================================
        // 引擎管理（下拉菜单）
        // ============================================================

        function getAllEngines() {
            return [...DEFAULT_ENGINES, ...customEngines];
        }

        function renderEngineDropdown() {
            const container = document.getElementById('engineDropdown');
            const all = getAllEngines();
            const currentName = currentEngine.name;
            let html = '';
            all.forEach(eng => {
                const checked = eng.name === currentName ? '✓' : '';
                html += `
                    <div class="ed-item" data-engine='${JSON.stringify(eng).replace(/'/g, "&#39;")}'>
                        <span>${eng.name}</span>
                        ${checked ? '<span class="ed-check">✓</span>' : ''}
                    </div>
                `;
            });
            html += `
                <div class="ed-custom">
                    <input type="text" id="customEngineName" placeholder="引擎名称">
                    <input type="text" id="customEngineUrl" placeholder="URL（{q}）">
                    <button id="addCustomEngineBtn">添加</button>
                </div>
            `;
            container.innerHTML = html;

            container.querySelectorAll('.ed-item[data-engine]').forEach(el => {
                el.addEventListener('click', function() {
                    const eng = JSON.parse(this.dataset.engine);
                    currentEngine = eng;
                    saveCurrentEngine();
                    updateEngineBtn();
                    closeEngineDropdown();
                    window.showToast('已切换到：' + eng.name);
                });
            });

            document.getElementById('addCustomEngineBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                const name = document.getElementById('customEngineName').value.trim();
                const url = document.getElementById('customEngineUrl').value.trim();
                if (!name || !url) {
                    window.showToast('请填写名称和URL');
                    return;
                }
                if (!url.includes('{q}')) {
                    window.showToast('URL中请包含 {q} 作为关键词占位');
                    return;
                }
                if (getAllEngines().some(e => e.name === name)) {
                    window.showToast('引擎名称已存在');
                    return;
                }
                customEngines.push({ name, url });
                saveCustomEngines();
                document.getElementById('customEngineName').value = '';
                document.getElementById('customEngineUrl').value = '';
                renderEngineDropdown();
                window.showToast('已添加：' + name);
            });
        }

        function toggleEngineDropdown() {
            const dd = document.getElementById('engineDropdown');
            dd.classList.toggle('open');
            if (dd.classList.contains('open')) {
                renderEngineDropdown();
            }
        }

        function closeEngineDropdown() {
            document.getElementById('engineDropdown').classList.remove('open');
        }

        function updateEngineBtn() {
            document.getElementById('engineBtn').textContent = currentEngine.name + ' ▾';
        }

        // ============================================================
        // 搜索
        // ============================================================

        function doSearch(query) {
            if (!query || !query.trim()) return;
            const q = query.trim();
            let url = '';
            if (q.startsWith('http://') || q.startsWith('https://')) {
                url = q;
            } else if (q.includes('.') && !q.includes(' ')) {
                url = 'https://' + q;
            } else {
                url = currentEngine.url.replace(/\{q\}/g, encodeURIComponent(q));
            }
            addHistory(q, url);
            addWindow(q, url);
            window.location.href = url;
        }

        // ============================================================
        // 窗口管理
        // ============================================================

        function addWindow(title, url) {
            const id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            windows.unshift({ id, title: title || url, url: url || 'about:blank', time: Date.now() });
            if (windows.length > 50) windows = windows.slice(0, 50);
            saveWindows();
            renderWindows();
        }

        function deleteWindow(id) {
            windows = windows.filter(w => w.id !== id);
            saveWindows();
            renderWindows();
        }

        function renderWindows() {
            const container = document.getElementById('windowList');
            if (windows.length === 0) {
                container.innerHTML = '<div class="window-empty">暂无窗口</div>';
                return;
            }
            let html = '';
            windows.forEach(w => {
                const initial = (w.title || '网')[0].toUpperCase();
                html += `
                    <div class="window-item" data-id="${w.id}">
                        <div class="w-icon">${initial}</div>
                        <div class="w-info">
                            <div class="w-title">${w.title || '未命名'}</div>
                            <div class="w-url">${w.url || ''}</div>
                        </div>
                        <button class="w-del" data-id="${w.id}">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.window-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.w-del')) return;
                    const id = this.dataset.id;
                    const w = windows.find(win => win.id === id);
                    if (w && w.url) {
                        addHistory(w.title, w.url);
                        window.location.href = w.url;
                    } else {
                        window.showToast('该窗口没有有效地址');
                    }
                });
            });

            container.querySelectorAll('.w-del').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    deleteWindow(id);
                    window.showToast('已删除窗口');
                });
            });
        }

        // ============================================================
        // 面板控制
        // ============================================================

        let activePanel = null;

        function openPanel(name) {
            closeAllPanels();
            activePanel = name;
            const overlay = document.getElementById(name + 'Overlay');
            const sheet = document.getElementById(name + 'Sheet');
            if (overlay) overlay.classList.add('show');
            if (sheet) sheet.classList.add('show');
        }

        function closePanel(name) {
            const overlay = document.getElementById(name + 'Overlay');
            const sheet = document.getElementById(name + 'Sheet');
            if (overlay) overlay.classList.remove('show');
            if (sheet) sheet.classList.remove('show');
            if (activePanel === name) activePanel = null;
        }

        function closeAllPanels() {
            ['menu', 'window', 'settings', 'download', 'history', 'tools'].forEach(name => {
                const overlay = document.getElementById(name + 'Overlay');
                const sheet = document.getElementById(name + 'Sheet');
                if (overlay) overlay.classList.remove('show');
                if (sheet) sheet.classList.remove('show');
            });
            activePanel = null;
        }

        // ============================================================
        // 菜单功能
        // ============================================================

        function handleMenuAction(action) {
            switch (action) {
                case 'settings':
                    closePanel('menu');
                    openPanel('settings');
                    break;
                case 'download':
                    closePanel('menu');
                    renderDownloads();
                    openPanel('download');
                    break;
                case 'history':
                    closePanel('menu');
                    renderHistory('fav');
                    openPanel('history');
                    break;
                case 'tools':
                    closePanel('menu');
                    openPanel('tools');
                    break;
                case 'fav':
                    if (window.location.href && window.location.href !== 'about:blank') {
                        addFavorite(document.title || window.location.href, window.location.href);
                    } else {
                        window.showToast('无法收藏空白页');
                    }
                    closePanel('menu');
                    break;
                case 'night':
                    document.body.classList.toggle('night-mode');
                    closePanel('menu');
                    window.showToast(document.body.classList.contains('night-mode') ? '夜间模式已开启' : '夜间模式已关闭');
                    break;
                case 'exit':
                    if (confirm('确定退出应用吗？')) {
                        window.showToast('正在退出...');
                        setTimeout(() => {
                            window.location.href = 'about:blank';
                        }, 500);
                    }
                    closePanel('menu');
                    break;
                default:
                    window.showToast('功能开发中');
                    closePanel('menu');
            }
        }

        // ============================================================
        // 背景图片设置
        // ============================================================

        function setupBackgroundPicker() {
            const fileInput = document.getElementById('bgFileInput');
            const trigger = document.getElementById('bgPickerTrigger');
            const reset = document.getElementById('resetBg');

            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                const total = bgImages.length + files.length;
                if (total > 9) {
                    window.showToast('最多选择9张图片');
                    this.value = '';
                    return;
                }
                let loaded = 0;
                for (let i = 0; i < files.length; i++) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        bgImages.push(ev.target.result);
                        loaded++;
                        if (loaded === files.length) {
                            saveBgImages();
                            if (bgImages.length === 1) {
                                applyBgImage(0);
                            } else {
                                startCarousel();
                            }
                            updateCarouselPreview();
                            window.showToast('已添加 ' + files.length + ' 张图片');
                            closePanel('settings');
                        }
                    };
