<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyBrowser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #e8ecf1;
            overflow: hidden;
            user-select: none;
        }
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .status-bar {
            height: 32px;
            flex-shrink: 0;
            background: transparent;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 18px 12px 18px;
            overflow-y: auto;
        }

        /* 搜索框毛玻璃 + 辉光 */
        .search-section {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 28px;
            box-shadow: 0 2px 20px rgba(41, 121, 255, 0.15), 0 1px 6px rgba(0,0,0,0.05);
            padding: 0 4px 0 0;
            transition: box-shadow 0.3s ease, background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .search-box:focus-within {
            box-shadow: 0 4px 30px rgba(41, 121, 255, 0.30), 0 1px 10px rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.75);
        }

        .engine-btn {
            flex-shrink: 0;
            padding: 0 10px 0 16px;
            height: 48px;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: #2979ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            position: relative;
            z-index: 5;
        }
        .engine-btn::after {
            content: "▾";
            font-size: 11px;
            color: #999;
            margin-left: 2px;
        }
        .engine-btn:active {
            opacity: 0.6;
        }

        /* 引擎下拉列表（从按钮下方展开） */
        .engine-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 200px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 8px 0;
            transform-origin: top center;
            transform: scaleY(0) translateY(-10px);
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
            z-index: 20;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            max-height: 300px;
            overflow-y: auto;
        }
        .engine-dropdown.open {
            transform: scaleY(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .engine-dropdown .ed-item {
            padding: 12px 18px;
            font-size: 14px;
            color: #1a1a2e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .engine-dropdown .ed-item:last-child {
            border-bottom: none;
        }
        .engine-dropdown .ed-item:active {
            background: rgba(41, 121, 255, 0.10);
        }
        .engine-dropdown .ed-item .ed-check {
            color: #2979ff;
            font-weight: 600;
        }
        .engine-dropdown .ed-custom {
            padding: 10px 18px;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .engine-dropdown .ed-custom input {
            flex: 1;
            min-width: 80px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            background: rgba(255,255,255,0.7);
        }
        .engine-dropdown .ed-custom input:focus {
            border-color: #2979ff;
        }
        .engine-dropdown .ed-custom button {
            padding: 8px 16px;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .engine-dropdown .ed-custom button:active {
            background: #1a5fd0;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 12px 4px;
            background: transparent;
            color: #1a1a2e;
            min-width: 0;
            height: 48px;
        }
        .search-box input::placeholder {
            color: #888;
            font-size: 15px;
            font-weight: 400;
        }

        .search-btn {
            flex-shrink: 0;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-right: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(41, 121, 255, 0.3);
        }
        .search-btn:active {
            background: #1a5fd0;
            transform: scale(0.96);
        }

        /* ===== 底部双圆钮（无文字，体积减半） ===== */
        .bottom-actions {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 12px 20px 24px 20px;
            background: transparent;
            position: relative;
            z-index: 2;
        }
        .bottom-actions .action-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #1a1a2e;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 0;
        }
        .bottom-actions .action-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.7);
        }

        /* ===== 面板毛玻璃 ===== */
        .panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 100;
            display: none;
            animation: fadeIn 0.25s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .panel-overlay.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .panel-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 28px 28px 0 0;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.10);
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .panel-sheet.show {
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 12px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }
        .panel-header .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .panel-header .panel-close {
            font-size: 26px;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .panel-header .panel-close:active {
            color: #555;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px 28px 18px;
            -webkit-overflow-scrolling: touch;
        }
        .panel-body::-webkit-scrollbar {
            display: none;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            padding-top: 8px;
        }
        .menu-grid .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 4px 12px 4px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            gap: 8px;
        }
        .menu-grid .menu-item:active {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }
        .menu-grid .menu-item .mi-icon {
            font-size: 28px;
            line-height: 1;
        }
        .menu-grid .menu-item .mi-label {
            font-size: 12px;
            color: #333;
            font-weight: 400;
            text-align: center;
        }

        .window-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 4px;
        }
        .window-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 12px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .window-item:active {
            background: rgba(255, 255, 255, 0.8);
        }
        .window-item .w-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(41, 121, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #2979ff;
            flex-shrink: 0;
        }
        .window-item .w-info {
            flex: 1;
            overflow: hidden;
        }
        .window-item .w-info .w-title {
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .window-item .w-info .w-url {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .window-item .w-del {
            background: none;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            flex-shrink: 0;
            transition: color 0.15s;
        }
        .window-item .w-del:active {
            color: #e74c3c;
        }
        .window-empty {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 40px 0;
        }
        .window-add {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }
        .window-add button {
            background: rgba(41, 121, 255, 0.9);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .window-add button:active {
            background: #1a5fd0;
            transform: scale(0.97);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 16px 30px;
            border-radius: 14px;
            font-size: 15px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            text-align: center;
            max-width: 75%;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .hidden {
            display: none !important;
        }

        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 4px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            cursor: pointer;
        }
        .settings-option:active {
            background: rgba(0,0,0,0.03);
        }
        .settings-option .s-label {
            font-size: 15px;
            color: #1a1a2e;
        }
        .settings-option .s-value {
            font-size: 14px;
            color: #2979ff;
        }
        .settings-option input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"></div>

        <div class="content-area">
            <div class="search-section">
                <div class="search-box">
                    <button class="engine-btn" id="engineBtn">必应 ▾</button>
                    <input type="text" id="searchInput" placeholder="搜索或输入网址" autofocus>
                    <button class="search-btn" id="searchBtn">搜索</button>
                </div>
                <!-- 引擎下拉列表 -->
                <div class="engine-dropdown" id="engineDropdown"></div>
            </div>
        </div>

        <!-- 底部双圆钮（无文字） -->
        <div class="bottom-actions">
            <button class="action-btn" id="navMenu">☰</button>
            <button class="action-btn" id="navWindow">⊞</button>
        </div>
    </div>

    <!-- ===== 面板：菜单 ===== -->
    <div class="panel-overlay" id="menuOverlay"></div>
    <div class="panel-sheet" id="menuSheet">
        <div class="panel-header">
            <span class="panel-title">菜单</span>
            <button class="panel-close" data-close="menu">✕</button>
        </div>
        <div class="panel-body">
            <div class="menu-grid">
                <button class="menu-item" data-action="settings"><span class="mi-icon">⚙</span><span class="mi-label">设置</span></button>
                <button class="menu-item" data-action="download"><span class="mi-icon">📥</span><span class="mi-label">下载管理</span></button>
                <button class="menu-item" data-action="history"><span class="mi-icon">⭐</span><span class="mi-label">收藏/历史</span></button>
                <button class="menu-item" data-action="tools"><span class="mi-icon">🧰</span><span class="mi-label">工具箱</span></button>
                <button class="menu-item" data-action="incognito"><span class="mi-icon">🕶️</span><span class="mi-label">无痕浏览</span></button>
                <button class="menu-item" data-action="fav"><span class="mi-icon">🔖</span><span class="mi-label">收藏网址</span></button>
                <button class="menu-item" data-action="window"><span class="mi-icon">⊞</span><span class="mi-label">窗口</span></button>
                <button class="menu-item" data-action="night"><span class="mi-icon">🌙</span><span class="mi-label">夜间模式</span></button>
                <button class="menu-item" data-action="exit"><span class="mi-icon">🚪</span><span class="mi-label">退出</span></button>
            </div>
        </div>
    </div>

    <!-- ===== 面板：窗口 ===== -->
    <div class="panel-overlay" id="windowOverlay"></div>
    <div class="panel-sheet" id="windowSheet">
        <div class="panel-header">
            <span class="panel-title">窗口管理</span>
            <button class="panel-close" data-close="window">✕</button>
        </div>
        <div class="panel-body">
            <div class="window-list" id="windowList"></div>
            <div class="window-add">
                <button id="addWindowBtn">+ 新建窗口</button>
            </div>
        </div>
    </div>

    <!-- ===== 设置面板 ===== -->
    <div class="panel-overlay" id="settingsOverlay"></div>
    <div class="panel-sheet" id="settingsSheet">
        <div class="panel-header">
            <span class="panel-title">设置</span>
            <button class="panel-close" data-close="settings">✕</button>
        </div>
        <div class="panel-body">
            <div class="settings-option" id="bgPickerTrigger">
                <span class="s-label">选择背景图片</span>
                <span class="s-value">点击选择 ›</span>
                <input type="file" id="bgFileInput" accept="image/*">
            </div>
            <div class="settings-option" id="resetBg">
                <span class="s-label">恢复默认背景</span>
                <span class="s-value">点击重置 ›</span>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ========================================================== -->
    <!-- 第二批：JavaScript 从这里开始                                -->
    <!-- ========================================================== -->
    <script>
        // ============================================================
        // 数据层
        // ============================================================

        // 引擎列表：必应、百度、谷歌 + 自定义
        const DEFAULT_ENGINES = [
            { name: '必应', url: 'https://cn.bing.com/search?q={q}&from=vivosearch2025' },
            { name: '百度', url: 'https://www.baidu.com/s?wd={q}' },
            { name: '谷歌', url: 'https://www.google.com/search?q={q}' },
        ];

        let currentEngine = { name: '必应', url: 'https://cn.bing.com/search?q={q}&from=vivosearch2025' };
        let customEngines = [];
        let windows = [];
        let lastVisit = null;
        let isIncognito = false;
        let bgImageData = null;

        // ============================================================
        // 存储
        // ============================================================

        function loadData() {
            try {
                const ce = localStorage.getItem('mybrowser_custom_engines');
                if (ce) customEngines = JSON.parse(ce);
                const eng = localStorage.getItem('mybrowser_current_engine');
                if (eng) currentEngine = JSON.parse(eng);
                const ws = localStorage.getItem('mybrowser_windows');
                if (ws) windows = JSON.parse(ws);
                const lv = localStorage.getItem('mybrowser_last_visit');
                if (lv) lastVisit = JSON.parse(lv);
                const incog = localStorage.getItem('mybrowser_incognito');
                if (incog) isIncognito = JSON.parse(incog);
                const bg = localStorage.getItem('mybrowser_bg_image');
                if (bg) {
                    bgImageData = bg;
                    document.body.style.backgroundImage = 'url(' + bg + ')';
                }
            } catch (e) { /* ignore */ }
        }

        function saveCustomEngines() {
            localStorage.setItem('mybrowser_custom_engines', JSON.stringify(customEngines));
        }
        function saveCurrentEngine() {
            localStorage.setItem('mybrowser_current_engine', JSON.stringify(currentEngine));
        }
        function saveWindows() {
            localStorage.setItem('mybrowser_windows', JSON.stringify(windows));
        }
        function saveLastVisit(title, url) {
            if (isIncognito) return;
            lastVisit = { title: title || url, url: url, time: Date.now() };
            localStorage.setItem('mybrowser_last_visit', JSON.stringify(lastVisit));
        }
        function saveIncognito() {
            localStorage.setItem('mybrowser_incognito', JSON.stringify(isIncognito));
        }
        function saveBgImage(data) {
            bgImageData = data;
            localStorage.setItem('mybrowser_bg_image', data);
            document.body.style.backgroundImage = 'url(' + data + ')';
        }
        function resetBgImage() {
            bgImageData = null;
            localStorage.removeItem('mybrowser_bg_image');
            document.body.style.backgroundImage = '';
        }

        // ============================================================
        // 引擎管理（下拉菜单）
        // ============================================================

        function getAllEngines() {
            return [...DEFAULT_ENGINES, ...customEngines];
        }

        function renderEngineDropdown() {
            const container = document.getElementById('engineDropdown');
            const all = getAllEngines();
            const currentName = currentEngine.name;
            let html = '';
            all.forEach(eng => {
                const checked = eng.name === currentName ? '✓' : '';
                html += `
                    <div class="ed-item" data-engine='${JSON.stringify(eng).replace(/'/g, "&#39;")}'>
                        <span>${eng.name}</span>
                        ${checked ? '<span class="ed-check">✓</span>' : ''}
                    </div>
                `;
            });
            html += `
                <div class="ed-custom">
                    <input type="text" id="customEngineName" placeholder="引擎名称">
                    <input type="text" id="customEngineUrl" placeholder="URL（{q}）">
                    <button id="addCustomEngineBtn">添加</button>
                </div>
            `;
            container.innerHTML = html;

            container.querySelectorAll('.ed-item[data-engine]').forEach(el => {
                el.addEventListener('click', function() {
                    const eng = JSON.parse(this.dataset.engine);
                    currentEngine = eng;
                    saveCurrentEngine();
                    updateEngineBtn();
                    closeEngineDropdown();
                    showToast('已切换到：' + eng.name);
                });
            });

            document.getElementById('addCustomEngineBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                const name = document.getElementById('customEngineName').value.trim();
                const url = document.getElementById('customEngineUrl').value.trim();
                if (!name || !url) {
                    showToast('请填写名称和URL');
                    return;
                }
                if (!url.includes('{q}')) {
                    showToast('URL中请包含 {q} 作为关键词占位');
                    return;
                }
                if (getAllEngines().some(e => e.name === name)) {
                    showToast('引擎名称已存在');
                    return;
                }
                customEngines.push({ name, url });
                saveCustomEngines();
                document.getElementById('customEngineName').value = '';
                document.getElementById('customEngineUrl').value = '';
                renderEngineDropdown();
                showToast('已添加：' + name);
            });
        }

        function toggleEngineDropdown() {
            const dd = document.getElementById('engineDropdown');
            dd.classList.toggle('open');
            if (dd.classList.contains('open')) {
                renderEngineDropdown();
            }
        }

        function closeEngineDropdown() {
            document.getElementById('engineDropdown').classList.remove('open');
        }

        function updateEngineBtn() {
            document.getElementById('engineBtn').textContent = currentEngine.name + ' ▾';
        }

        // ============================================================
        // 搜索
        // ============================================================

        function doSearch(query) {
            if (!query || !query.trim()) return;
            const q = query.trim();
            let url = '';
            if (q.startsWith('http://') || q.startsWith('https://')) {
                url = q;
            } else if (q.includes('.') && !q.includes(' ')) {
                url = 'https://' + q;
            } else {
                url = currentEngine.url.replace(/\{q\}/g, encodeURIComponent(q));
            }
            saveLastVisit(q, url);
            addWindow(q, url);
            window.location.href = url;
        }

        // ============================================================
        // 窗口管理
        // ============================================================

        function addWindow(title, url) {
            const id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            windows.unshift({ id, title: title || url, url: url || 'about:blank', time: Date.now() });
            if (windows.length > 50) windows = windows.slice(0, 50);
            saveWindows();
            renderWindows();
        }

        function deleteWindow(id) {
            windows = windows.filter(w => w.id !== id);
            saveWindows();
            renderWindows();
        }

        function renderWindows() {
            const container = document.getElementById('windowList');
            if (windows.length === 0) {
                container.innerHTML = '<div class="window-empty">暂无窗口</div>';
                return;
            }
            let html = '';
            windows.forEach(w => {
                const initial = (w.title || '网')[0].toUpperCase();
                html += `
                    <div class="window-item" data-id="${w.id}">
                        <div class="w-icon">${initial}</div>
                        <div class="w-info">
                            <div class="w-title">${w.title || '未命名'}</div>
                            <div class="w-url">${w.url || ''}</div>
                        </div>
                        <button class="w-del" data-id="${w.id}">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.window-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.w-del')) return;
                    const id = this.dataset.id;
                    const w = windows.find(win => win.id === id);
                    if (w && w.url) {
                        saveLastVisit(w.title, w.url);
                        window.location.href = w.url;
                    } else {
                        showToast('该窗口没有有效地址');
                    }
                });
            });

            container.querySelectorAll('.w-del').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    deleteWindow(id);
                    showToast('已删除窗口');
                });
            });
        }

        // ============================================================
        // 面板控制
        // ============================================================

        let activePanel = null;

        function openPanel(name) {
            closeAllPanels();
            activePanel = name;
            const overlay = document.getElementById(name + 'Overlay');
            const sheet = document.getElementById(name + 'Sheet');
            if (overlay) overlay.classList.add('show');
            if (sheet) sheet.classList.add('show');
        }

        function closePanel(name) {
            const overlay = document.getElementById(name + 'Overlay');
            const sheet = document.getElementById(name + 'Sheet');
            if (overlay) overlay.classList.remove('show');
            if (sheet) sheet.classList.remove('show');
            if (activePanel === name) activePanel = null;
        }

        function closeAllPanels() {
            ['menu', 'window', 'settings'].forEach(name => {
                const overlay = document.getElementById(name + 'Overlay');
                const sheet = document.getElementById(name + 'Sheet');
                if (overlay) overlay.classList.remove('show');
                if (sheet) sheet.classList.remove('show');
            });
            activePanel = null;
        }

        // ============================================================
        // Toast
        // ============================================================

        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 1800);
        }

        // ============================================================
        // 菜单功能
        // ============================================================

        function handleMenuAction(action) {
            switch (action) {
                case 'settings':
                    closePanel('menu');
                    openPanel('settings');
                    break;
                case 'download':
                    showToast('「下载管理」功能开发中');
                    closePanel('menu');
                    break;
                case 'history':
                    showToast('「收藏/历史」功能开发中');
                    closePanel('menu');
                    break;
                case 'tools':
                    showToast('「工具箱」功能开发中');
                    closePanel('menu');
                    break;
                case 'incognito':
                    isIncognito = !isIncognito;
                    saveIncognito();
                    showToast(isIncognito ? '已开启无痕浏览' : '已关闭无痕浏览');
                    closePanel('menu');
                    break;
                case 'fav':
                    showToast('「收藏网址」功能开发中');
                    closePanel('menu');
                    break;
                case 'window':
                    closePanel('menu');
                    openPanel('window');
                    renderWindows();
                    break;
                case 'night':
                    showToast('「夜间模式」功能开发中');
                    closePanel('menu');
                    break;
                case 'exit':
                    if (confirm('确定退出应用吗？')) {
                        showToast('正在退出...');
                        setTimeout(() => {
                            window.location.href = 'about:blank';
                        }, 500);
                    }
                    closePanel('menu');
                    break;
                default:
                    showToast('功能开发中');
                    closePanel('menu');
            }
        }

        // ============================================================
        // 背景图片设置（修复点击无反应）
        // ============================================================

        function setupBackgroundPicker() {
            const fileInput = document.getElementById('bgFileInput');
            const trigger = document.getElementById('bgPickerTrigger');
            const reset = document.getElementById('resetBg');

            // 确保点击整个选项区域都能触发文件选择
            trigger.addEventListener('click', function(e) {
                // 防止冒泡干扰
                e.stopPropagation();
                // 直接触发 file input
                fileInput.click();
            });

            // 文件选择变化时处理
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    saveBgImage(dataUrl);
                    showToast('背景图片已更新');
                    closePanel('settings');
                };
                reader.readAsDataURL(file);
                // 重置 input 以便重复选择同一文件
                this.value = '';
            });

            // 重置背景
            reset.addEventListener('click', function() {
                resetBgImage();
                showToast('已恢复默认背景');
                closePanel('settings');
            });
        }

        // ============================================================
        // 初始化
        // ============================================================

        function init() {
            loadData();
            updateEngineBtn();
            renderWindows();
            setupBackgroundPicker();

            document.getElementById('searchBtn').addEventListener('click', function() {
                doSearch(document.getElementById('searchInput').value);
            });
            document.getElementById('searchInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doSearch(this.value);
                }
            });

            document.getElementById('engineBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                toggleEngineDropdown();
            });

            document.addEventListener('click', function(e) {
                const dd = document.getElementById('engineDropdown');
                const btn = document.getElementById('engineBtn');
                if (!dd.contains(e.target) && !btn.contains(e.target)) {
                    closeEngineDropdown();
                }
            });

            // 底部双圆钮
            document.getElementById('navMenu').addEventListener('click', function() {
                if (activePanel === 'menu') { closePanel('menu'); return; }
                openPanel('menu');
            });
            document.getElementById('navWindow').addEventListener('click', function() {
                if (activePanel === 'window') { closePanel('window'); return; }
                renderWindows();
                openPanel('window');
            });

            document.querySelectorAll('.panel-close').forEach(btn => {
                btn.addEventListener('click', function() {
                    closePanel(this.dataset.close);
                });
            });
            document.querySelectorAll('.panel-overlay').forEach(overlay => {
                overlay.addEventListener('click', function() {
                    const name = this.id.replace('Overlay', '');
                    closePanel(name);
                });
            });

            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    const action = this.dataset.action;
                    handleMenuAction(action);
                });
            });

            document.getElementById('addWindowBtn').addEventListener('click', function() {
                const id = 'win_' + Date.now();
                windows.unshift({ id, title: '新窗口', url: 'about:blank', time: Date.now() });
                saveWindows();
                renderWindows();
                showToast('已创建新窗口');
                window.location.href = 'about:blank';
            });

            setTimeout(() => {
                document.getElementById('searchInput').focus();
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                loadData();
                renderWindows();
                updateEngineBtn();
            }
        });
    </script>
</body>
</html>
