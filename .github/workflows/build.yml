name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动配置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.2

      - name: 解码签名文件
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/mybrowser.keystore
          chmod 644 app/mybrowser.keystore

      - name: 验证签名文件（非常重要）
        run: |
          keytool -list -v -keystore app/mybrowser.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            || (echo "❌ 密钥库验证失败，请检查密码或别名" && exit 1)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译生成 APK（带详细日志）
        run: ./gradlew assembleDebug --stacktrace --info
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-debug
          path: app/build/outputs/apk/debug/*.apk